# One-click Render deploy.
# Dashboard → New → Blueprint → this repository.
#
# Free Postgres expires 30 days after creation. The Sidekiq worker is the
# smallest paid plan because Render does not offer free background workers,
# and a sleeping web service would drop campaign sends.

databases:
  - name: meta-messaging-db
    plan: free
    region: singapore
    databaseName: marquee_production
    user: marquee
    ipAllowList: []

services:
  - type: keyvalue
    name: meta-messaging-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: meta-messaging-platform
    runtime: ruby
    plan: free
    region: singapore
    buildCommand: bundle install && bundle exec rails assets:precompile
    preDeployCommand: bundle exec rails db:migrate db:seed
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meta-messaging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: meta-messaging-redis
          type: keyvalue
          property: connectionString
      - key: REDIS_URL_CABLE
        fromService:
          name: meta-messaging-redis
          type: keyvalue
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_LEVEL
        value: info
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        generateValue: true
      - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        generateValue: true
      - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        generateValue: true
      - key: META_GRAPH_VERSION
        value: v26.0

  - type: worker
    name: meta-messaging-worker
    runtime: ruby
    plan: starter
    region: singapore
    buildCommand: bundle install
    startCommand: bundle exec sidekiq -C config/sidekiq.yml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meta-messaging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: meta-messaging-redis
          type: keyvalue
          property: connectionString
      - key: REDIS_URL_CABLE
        fromService:
          name: meta-messaging-redis
          type: keyvalue
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_LEVEL
        value: info
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: SECRET_KEY_BASE
        fromService:
          name: meta-messaging-platform
          type: web
          envVarKey: SECRET_KEY_BASE
      - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        fromService:
          name: meta-messaging-platform
          type: web
          envVarKey: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
      - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        fromService:
          name: meta-messaging-platform
          type: web
          envVarKey: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
      - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        fromService:
          name: meta-messaging-platform
          type: web
          envVarKey: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
      - key: META_GRAPH_VERSION
        value: v26.0
