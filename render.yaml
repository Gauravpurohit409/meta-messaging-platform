# One-click Render deploy.
# Dashboard → New → Blueprint → this repository.
#
# Web, Postgres, key-value, and the worker stay on paid plans so webhooks
# and sends keep running. The retention cron deletes old data once a day.

databases:
  - name: meta-messaging-db
    plan: basic-256mb
    region: singapore
    databaseName: marquee_production
    user: marquee
    ipAllowList: []

services:
  - type: keyvalue
    name: meta-messaging-redis
    plan: starter
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: meta-messaging-platform
    runtime: ruby
    plan: starter
    region: singapore
    buildCommand: bundle install && bundle exec rails assets:precompile
    preDeployCommand: bundle exec rails db:migrate db:seed
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meta-messaging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: meta-messaging-redis
          type: keyvalue
          property: connectionString
      - key: REDIS_URL_CABLE
        fromService:
          name: meta-messaging-redis
          type: keyvalue
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_LEVEL
        value: info
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        generateValue: true
      - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        generateValue: true
      - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        generateValue: true
      - key: META_GRAPH_VERSION
        value: v26.0
      - key: SUPPORT_EMAIL
        sync: false
      - key: SMTP_ADDRESS
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: RETENTION_WEBHOOK_DAYS
        value: "30"
      - key: RETENTION_RECIPIENT_DAYS
        value: "180"

  - type: worker
    name: meta-messaging-worker
    runtime: ruby
    plan: starter
    region: singapore
    buildCommand: bundle install
    startCommand: bundle exec sidekiq -C config/sidekiq.yml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meta-messaging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: meta-messaging-redis
          type: keyvalue
          property: connectionString
      - key: REDIS_URL_CABLE
        fromService:
          name: meta-messaging-redis
          type: keyvalue
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_LEVEL
        value: info
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: SECRET_KEY_BASE
        fromService:
          name: meta-messaging-platform
          type: web
          envVarKey: SECRET_KEY_BASE
      - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        fromService:
          name: meta-messaging-platform
          type: web
          envVarKey: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
      - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        fromService:
          name: meta-messaging-platform
          type: web
          envVarKey: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
      - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        fromService:
          name: meta-messaging-platform
          type: web
          envVarKey: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
      - key: META_GRAPH_VERSION
        value: v26.0

  - type: cron
    name: meta-messaging-retention
    runtime: ruby
    plan: starter
    region: singapore
    schedule: "0 21 * * *"
    buildCommand: bundle install
    startCommand: bundle exec rails retention:purge
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meta-messaging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: meta-messaging-redis
          type: keyvalue
          property: connectionString
      - key: REDIS_URL_CABLE
        fromService:
          name: meta-messaging-redis
          type: keyvalue
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_LEVEL
        value: info
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: SECRET_KEY_BASE
        fromService:
          name: meta-messaging-platform
          type: web
          envVarKey: SECRET_KEY_BASE
      - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        fromService:
          name: meta-messaging-platform
          type: web
          envVarKey: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
      - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        fromService:
          name: meta-messaging-platform
          type: web
          envVarKey: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
      - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        fromService:
          name: meta-messaging-platform
          type: web
          envVarKey: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
      - key: META_GRAPH_VERSION
        value: v26.0
      - key: RETENTION_WEBHOOK_DAYS
        value: "30"
      - key: RETENTION_RECIPIENT_DAYS
        value: "180"
