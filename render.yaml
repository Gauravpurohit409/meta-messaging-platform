databases:
  - name: meta-messaging-db
    plan: free
    databaseName: marquee_production
    user: marquee

services:
  - type: redis
    name: meta-messaging-redis
    plan: free
    ipAllowList: []

  - type: web
    name: meta-messaging-platform
    runtime: ruby
    plan: free
    buildCommand: bundle install && bundle exec rails assets:precompile && bundle exec rails db:migrate
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meta-messaging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: meta-messaging-redis
          type: redis
          property: connectionString
      - key: REDIS_URL_CABLE
        fromService:
          name: meta-messaging-redis
          type: redis
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        sync: false
      - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        sync: false
      - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        sync: false
      - key: META_GRAPH_VERSION
        value: v26.0
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false

  - type: worker
    name: meta-messaging-worker
    runtime: ruby
    plan: free
    buildCommand: bundle install
    startCommand: bundle exec sidekiq -C config/sidekiq.yml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meta-messaging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: meta-messaging-redis
          type: redis
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        sync: false
      - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        sync: false
      - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        sync: false
      - key: META_APP_SECRET
        sync: false
